:root{--noche:#3D0C1E;--burdeos:#8E2045;--cal:#F6EFE8;--papel:#FBF7F3;--linea:#E4D6CB;--suave:#F0E5DB}
*{box-sizing:border-box}
html{background:var(--cal)}
body{margin:0;background:var(--cal);color:var(--noche);font:500 17px/1.65 Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
.cabecera{height:136px;display:flex;align-items:center;justify-content:center;background:var(--burdeos) url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%2296%22%20height%3D%22166.66%22%3E%3Cpath%20fill%3D%22%23fff%22%20fill-opacity%3D%22.06%22%20d%3D%22M0.00%2052.08V7.44A29.76%2029.76%200%200%201%2059.52%207.44V52.08ZM0.00%20218.74V174.10A29.76%2029.76%200%200%201%2059.52%20174.10V218.74ZM-48.00%20135.41V90.77A29.76%2029.76%200%200%201%2011.52%2090.77V135.41ZM48.00%20135.41V90.77A29.76%2029.76%200%200%201%20107.52%2090.77V135.41Z%22/%3E%3C/svg%3E") center top/96px 166.66px}
.cabecera .marca{display:block;height:40px;width:auto}
main{max-width:720px;margin:0 auto;padding:56px 24px 32px}
h1,h2,h3{font-family:Fraunces,Georgia,serif;font-weight:800;line-height:1.12;color:var(--noche)}
h1{font-size:40px;margin:0 0 20px}
h2{font-size:25px;margin:44px 0 12px}
h3{font-size:20px;margin:32px 0 8px}
p,ul,ol{margin:0 0 16px}
a{color:var(--burdeos);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:3px}
a:hover,a:focus-visible{text-decoration-thickness:2.5px}
a:focus-visible{outline:2px solid var(--burdeos);outline-offset:3px;border-radius:4px}
strong{font-weight:800}
ul,ol{padding-left:1.3em}
li{margin:0 0 8px}
li::marker{color:var(--burdeos);font-weight:800}
table{width:100%;margin:0 0 20px;border-collapse:separate;border-spacing:0;border:1px solid var(--linea);border-radius:14px;overflow:hidden;background:var(--papel);font-size:15px;line-height:1.5}
th,td{text-align:left;vertical-align:top;padding:10px 14px;border-bottom:1px solid var(--linea)}
th{font-weight:800;background:var(--suave)}
tr:last-child td{border-bottom:0}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.88em;background:var(--suave);padding:2px 6px;border-radius:6px;overflow-wrap:anywhere}
.pie{max-width:720px;margin:0 auto;padding:22px 24px 48px;border-top:1px solid var(--linea);display:flex;align-items:center;gap:10px;font-size:14px;color:rgba(61,12,30,.72)}
.pie svg{width:18px;height:auto;flex:none}
@media (max-width:600px){body{font-size:16px}.cabecera{height:104px}.cabecera .marca{height:30px}main{padding:36px 20px 24px}h1{font-size:30px}h2{font-size:21px;margin-top:36px}table{font-size:14px}th,td{padding:9px 10px}.pie{padding:20px 20px 40px}}
</style>
